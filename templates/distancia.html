{% extends "layout.html" %}
{% block contenido %}

<h1>DISTANCIA ENTRE DOS PUNTOS</h1>

<p>FÓRMULA: √((X₂ - X₁)**2 + (Y₂ - Y₁)**2)</p>

<form action="/distancia" method="get">
  <label for="X2">X2:</label>
  <input type="number" id="X2" name="X2" step="any" required><br>

  <label for="X1">X1:</label>
  <input type="number" id="X1" name="X1" step="any" required><br>

  <label for="Y2">Y2:</label>
  <input type="number" id="Y2" name="Y2" step="any" required><br>

  <label for="Y1">Y1:</label>
  <input type="number" id="Y1" name="Y1" step="any" required><br><br>

  <button type="submit">CALCULAR</button>
</form>

{% if resultado %}
  <hr>
  <h2>Distancia = {{ resultado }}</h2>
{% endif %}

{% endblock %}
